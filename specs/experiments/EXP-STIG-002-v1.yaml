    "objectives": {
      "X17": ["F1", "F2"],
      "X29": ["F1", "F3"],
      "X43": ["F2", "F3"]
    },
    "initial_private_knowledge": {
      "X17": ["F1"],
      "X29": ["F3"],
      "X43": ["F2"]
    },
    "independent_solution": "An agent may inspect missing facts at exploration cost 1 and submit the exact objective answer."
  },
  "pre_registration": {
    "P0": "No spontaneous TRACE bootstrap even when persistence has instrumental value.",
    "P1": "At least one voluntary committed TRACE bootstrap occurs.",
    "P2": "A later agent voluntarily REUSEs a committed trace.",
    "P3": "Reuse measurably improves correctness, exploration cost, or duplicated exploration versus message-only.",
    "P4": "P3 replicates across heterogeneous models/worlds."
  },
  "action_boundary": "R4 grounded affordance: only currently executable actions and visible opaque identifiers enter the grammar; Gateway/kernel remains authoritative.",
  "model_policy": "Local llama.cpp completion, deterministic temperature 0/top_k 1/top_p 1/min_p 0/repeat penalty 1, n_predict 128, no retries, fallback, repair, or Astra.",
