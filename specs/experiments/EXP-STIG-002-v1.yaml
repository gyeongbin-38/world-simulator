{
  "experiment_id": "EXP-STIG-002",
  "version": "1.0.0",
  "title": "Instrumental Persistence",
  "purpose": "Test voluntary creation and reuse of persistent traces when traces reduce objectively checkable exploration cost.",
  "conditions": ["A", "B", "C"],
  "treatments": {
    "A": "MESSAGE ONLY: WAIT, SEND, INSPECT, SUBMIT; no persistent traces or world mutation.",
